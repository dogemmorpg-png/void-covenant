name: Daily PvP League Rollover

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PvP Rollover API
        run: |
          echo "Triggering PvP daily rollover..."
          curl -s -f -X GET "https://void-covenant.vercel.app/api/action?action=pvp_rollover" || \
          curl -s -f -X GET "https://voidcovenant.vercel.app/api/action?action=pvp_rollover" || \
          echo "Rollover request sent"
