<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Void Covenant - Dark Fantasy Card RPG</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          var isTg = Boolean((window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || /Telegram/i.test(navigator.userAgent || ''));
          var tg = isTg ? window.Telegram.WebApp : null;
          if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            var h = tg.viewportHeight || window.innerHeight;
            document.documentElement.style.setProperty('--app-height', h + 'px');
          } else {
            var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            document.documentElement.style.setProperty('--app-height', h + 'px');
            document.documentElement.style.setProperty('--safe-top', '0px');
            document.documentElement.style.setProperty('--safe-bottom', '0px');
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Void Covenant is an authoritative Dark Fantasy Card RPG game. Collect entities, battle in campaign & arena, and earn Sovereign dividends." />
    <meta name="theme-color" content="#0b0c10" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Void Covenant - Dark Fantasy Card RPG" />
    <meta property="og:description" content="Official Void Covenant Web3 Tactical Card RPG Game. Summon entities, conquer abyssal floors, and claim legendary spoils." />
    <meta property="og:image" content="/logo.webp" />
    <meta property="og:url" content="https://voidcovenant.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Void Covenant Web3 RPG" />
    <meta name="twitter:description" content="Summon abyssal creatures and battle in campaign & arena." />
    <meta name="twitter:image" content="/logo.webp" />

    <link rel="apple-touch-icon" href="/logo.webp" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.webp" />
    
    <!-- Dark fantasy fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0b0c10] text-[#c5c6c7] select-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
